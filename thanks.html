<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ಧನ್ಯವಾದಗಳು | Thank You</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      text-align: center;
      padding: 60px 20px;
      font-family: 'Noto Sans Kannada', 'Arial', sans-serif;
      background: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }

    h2 {
      color: #2e8b57;
      font-size: 36px;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      text-decoration: none;
      background-color: #f07a03; /* Saffron matching the theme */
      color: white;
      padding: 15px 30px;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.3s ease;
      font-size: 1.1rem;
    }

    a:hover {
      background-color: #d86d02;
      transform: translateY(-2px);
    }
  </style>
  <link rel="icon" type="image/jpeg" href="/favicon.jpg">
</head>
<body>

  <h2>ಧನ್ಯವಾದಗಳು 🙏<br>Thank You!</h2>
  <p>ನಿಮ್ಮ ಅರ್ಜಿಯನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಸಲ್ಲಿಸಲಾಗಿದೆ. ನಮ್ಮ ತಂಡವು ಅದನ್ನು ಪರಿಶೀಲಿಸಿದ ನಂತರ ನಿಮಗೆ ಖಚಿತಪಡಿಸಲಾಗುವುದು.</p>
  <p>Your application has been successfully submitted. It is currently pending review.</p>

  <div id="statusBtnContainer" style="margin-top: 20px;">
    <!-- Status button will be injected here if ID exists -->
  </div>

  <a href="index.html" style="margin-top: 20px; background-color: #6c757d;">ಮುಖಪುಟಕ್ಕೆ ಹಿಂತಿರುಗಿ / Return Home</a>

  <script type="module">
    import { supabase } from './src/supabaseClient.js';
    
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    
    if(id) {
      document.getElementById("statusBtnContainer").innerHTML = `
        <a href="card.html?id=${id}">ಅರ್ಜಿ ಸ್ಥಿತಿ ಪರಿಶೀಲಿಸಿ / Check Application Status</a>
      `;

      // Auto-poll Supabase every 5 seconds to see if Admin approved it
      setInterval(async () => {
        const { data, error } = await supabase.from('memberships').select('status').eq('id', id).single();
        if (data && data.status === 'Approved') {
          // If approved, automatically redirect to the card!
          window.location.href = `card.html?id=${id}`;
        }
      }, 5000);
    }
  </script>
</body>
</html>
