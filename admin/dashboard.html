<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        Admin Panel
      </div>
      <nav class="sidebar-nav">
        <button class="tab-btn active" data-target="galleryTab">📸 Gallery</button>
        <button class="tab-btn" data-target="membershipsTab">👥 Memberships</button>
        <button class="tab-btn" data-target="contactsTab">✉️ Messages</button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="topbar">
        <h2 id="topbarTitle">Gallery Management</h2>
        <button id="logoutBtn">Logout</button>
      </div>

      <div class="content-area">
        
        <!-- =======================
             TAB 1: GALLERY
        ======================== -->
        <div id="galleryTab" class="tab-pane active">
          <div class="card">
            <h2>Upload New Photo</h2>
            <form id="uploadForm">
              <div class="form-group">
                <label>Title</label>
                <input type="text" id="photoTitle" required>
              </div>
              <div class="form-group">
                <label>Category</label>
                <select id="photoCategory" required>
                  <option value="events">Events</option>
                  <option value="meetings">Meetings</option>
                  <option value="celebrations">Celebrations</option>
                  <option value="programs">Programs</option>
                </select>
              </div>
              <div class="form-group">
                <label>Image File</label>
                <input type="file" id="photoFile" accept="image/*" required>
              </div>
              <button type="submit" class="btn-sm btn-publish" style="padding: 10px 20px;" id="uploadBtn">Upload & Publish</button>
            </form>
            <div id="uploadStatus" style="margin-top: 10px; font-weight: bold;"></div>
          </div>

          <div class="card">
            <h2>Gallery Items</h2>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="galleryTableBody">
                  <tr><td colspan="5">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- =======================
             TAB 2: MEMBERSHIPS
        ======================== -->
        <div id="membershipsTab" class="tab-pane">
          <div class="card">
            <h2>Membership Applications</h2>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Type</th>
                    <th>Transaction ID</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="membershipsTableBody">
                  <tr><td colspan="6">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- =======================
             TAB 3: CONTACTS
        ======================== -->
        <div id="contactsTab" class="tab-pane">
          <div class="card">
            <h2>Contact Requests</h2>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Message</th>
                  </tr>
                </thead>
                <tbody id="contactsTableBody">
                  <tr><td colspan="5">Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Image Modal for Memberships -->
  <div class="modal-overlay" id="imageModal">
    <div class="modal-content">
      <span class="modal-close" id="closeModal">&times;</span>
      <h3>Applicant Photo</h3>
      <img id="modalImg" src="" class="modal-img" alt="Applicant Photo">
    </div>
  </div>

  <script type="module">
    import { supabase } from '../src/supabaseClient.js';

    // Auth Protection
    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) window.location.href = 'login.html';
    }
    checkAuth();

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'login.html';
    });

    // Tab Switching Logic
    const tabs = document.querySelectorAll('.tab-btn');
    const panes = document.querySelectorAll('.tab-pane');
    const topbarTitle = document.getElementById('topbarTitle');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        panes.forEach(p => p.classList.remove('active'));
        
        tab.classList.add('active');
        document.getElementById(tab.getAttribute('data-target')).classList.add('active');
        topbarTitle.innerText = tab.innerText.substring(3); // Remove emoji

        // Load data based on tab
        if (tab.getAttribute('data-target') === 'galleryTab') loadGalleryItems();
        if (tab.getAttribute('data-target') === 'membershipsTab') loadMemberships();
        if (tab.getAttribute('data-target') === 'contactsTab') loadContacts();
      });
    });

    // ==========================================
    // GALLERY LOGIC
    // ==========================================
    async function loadGalleryItems() {
      const tbody = document.getElementById('galleryTableBody');
      const { data, error } = await supabase.from('gallery').select('*').order('created_at', { ascending: false });

      if (error) return tbody.innerHTML = '<tr><td colspan="5">Error loading data.</td></tr>';
      if (!data || data.length === 0) return tbody.innerHTML = '<tr><td colspan="5">No items found.</td></tr>';

      tbody.innerHTML = data.map(item => {
        let imageUrl = item.image_url;
        if(item.storage_path) {
            const { data: urlData } = supabase.storage.from('gallery_images').getPublicUrl(item.storage_path);
            imageUrl = urlData.publicUrl;
        }
        return `
          <tr>
            <td><img src="${imageUrl}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;"></td>
            <td>${item.title}</td>
            <td>${item.category}</td>
            <td>${item.is_published ? '<span style="color: green;">Published</span>' : '<span style="color: red;">Hidden</span>'}</td>
            <td>
              <button class="btn-sm btn-publish toggle-btn" data-id="${item.id}" data-status="${item.is_published}">${item.is_published ? 'Unpublish' : 'Publish'}</button>
              <button class="btn-sm btn-delete delete-btn" data-id="${item.id}" data-path="${item.storage_path}">Delete</button>
            </td>
          </tr>
        `;
      }).join('');

      document.querySelectorAll('.toggle-btn').forEach(btn => btn.addEventListener('click', togglePublish));
      document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', deleteItem));
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('photoTitle').value;
      const category = document.getElementById('photoCategory').value;
      const file = document.getElementById('photoFile').files[0];
      const status = document.getElementById('uploadStatus');

      if (!file) return;
      status.textContent = 'Uploading...';

      const fileExt = file.name.split('.').pop();
      const filePath = `${category}/${Math.random()}.${fileExt}`;

      try {
        const { error: uploadError } = await supabase.storage.from('gallery_images').upload(filePath, file);
        if (uploadError) throw uploadError;

        const { error: dbError } = await supabase.from('gallery').insert([{
          title, category, storage_path: filePath, image_url: 'storage', is_published: true
        }]);
        if (dbError) throw dbError;

        status.style.color = 'green';
        status.textContent = 'Uploaded!';
        document.getElementById('uploadForm').reset();
        loadGalleryItems();
      } catch (error) {
        status.style.color = 'red';
        status.textContent = 'Error: ' + error.message;
      }
    });

    async function togglePublish(e) {
      const id = e.target.getAttribute('data-id');
      const isPublished = e.target.getAttribute('data-status') === 'true';
      await supabase.from('gallery').update({ is_published: !isPublished }).eq('id', id);
      loadGalleryItems();
    }

    async function deleteItem(e) {
      if (!confirm('Delete this photo?')) return;
      const id = e.target.getAttribute('data-id');
      const path = e.target.getAttribute('data-path');
      if (path) await supabase.storage.from('gallery_images').remove([path]);
      await supabase.from('gallery').delete().eq('id', id);
      loadGalleryItems();
    }

    // ==========================================
    // MEMBERSHIPS LOGIC
    // ==========================================
    async function loadMemberships() {
      const tbody = document.getElementById('membershipsTableBody');
      const { data, error } = await supabase.from('memberships').select('*').order('created_at', { ascending: false });

      if (error) return tbody.innerHTML = '<tr><td colspan="6">Error loading data.</td></tr>';
      if (!data || data.length === 0) return tbody.innerHTML = '<tr><td colspan="6">No applications found.</td></tr>';

      tbody.innerHTML = data.map(item => `
        <tr>
          <td>${new Date(item.created_at).toLocaleDateString()}</td>
          <td>${item.name}</td>
          <td>${item.phone}</td>
          <td>${item.membership_type} (₹${item.membership_fee})</td>
          <td>${item.transaction_id}</td>
          <td>
            <button class="btn-sm btn-edit view-photo-btn" data-path="${item.photo_storage_path}">View Photo</button>
          </td>
        </tr>
      `).join('');

      document.querySelectorAll('.view-photo-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const path = e.target.getAttribute('data-path');
          if(path) {
            const { data } = supabase.storage.from('members_photos').getPublicUrl(path);
            document.getElementById('modalImg').src = data.publicUrl;
            document.getElementById('imageModal').classList.add('active');
          } else {
            alert("No photo found.");
          }
        });
      });
    }

    // Close Modal
    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('imageModal').classList.remove('active');
    });

    // ==========================================
    // CONTACTS LOGIC
    // ==========================================
    async function loadContacts() {
      const tbody = document.getElementById('contactsTableBody');
      const { data, error } = await supabase.from('contact_requests').select('*').order('created_at', { ascending: false });

      if (error) return tbody.innerHTML = '<tr><td colspan="5">Error loading data.</td></tr>';
      if (!data || data.length === 0) return tbody.innerHTML = '<tr><td colspan="5">No messages found.</td></tr>';

      tbody.innerHTML = data.map(item => `
        <tr>
          <td>${new Date(item.created_at).toLocaleDateString()}</td>
          <td>${item.name}</td>
          <td>${item.email}</td>
          <td>${item.phone}</td>
          <td>${item.message}</td>
        </tr>
      `).join('');
    }

    // Init First Tab
    loadGalleryItems();

  </script>
</body>
</html>
